<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic and Non-Semantic Elements</title>
</head>
<body>
    <!-- Semantic layout -->
    <header>
        <h1>College Portal</h1>
        <nav><a href="#home">Home</a> | <a href="#courses">Courses</a></nav>
    </header>

    <main id="home">
        <section id="courses">
            <h2>Admission Open</h2>
            <p>Apply before 30 June.</p>
        </section>
        <aside>Notice: Library closed Sunday.</aside>
    </main>

    <footer>&copy; 2026 College</footer>

    <!-- A non-semantic layout could use div elements for the same sections. -->
</body>
</html>
