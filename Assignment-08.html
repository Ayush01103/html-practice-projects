<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hyperlinks and Images</title>
</head>
<body id="top">
    <p>Links demo</p>
    <a href="https://www.example.com" target="_blank" rel="noopener">External link</a><br>
    <a href="#bottom">Jump to bottom</a><br>
    <a href="mailto:admin@example.com">Email us</a><br>
    <a href="https://www.example.com" title="Visit Example website">Logo</a>
    <p>
        <img src="https://placehold.co/120x80?text=Logo"
             alt="Sample college logo" width="120" height="80">
    </p>
    <div style="height: 300px;"></div>
    <p id="bottom">Bottom. <a href="#top">Back to top</a></p>
</body>
</html>
